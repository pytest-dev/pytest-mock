exclude: '^($|.*\.bin)'
repos:
  - repo: local
    hooks:
      - id: rst
        name: rst
        entry: rst-lint
        files: ^(CHANGELOG|README|RELEASING|docs/.*)\.rst$
        # index.rst uses Sphinx-only directives (toctree) unknown to docutils.
        exclude: ^docs/index\.rst$
        language: python
        additional_dependencies: [pygments, restructuredtext_lint]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^(src|tests)
        args: []
        additional_dependencies: [pytest>=6, types-mock]
